<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Álbum Copa BugCon 2026</title>
<!--
  Álbum web del badge BugCon 2026 (F6.3). Un solo HTML sin dependencias:
  funciona desde file://, hospedado (F6.9) y en el teléfono.

  Dos fuentes (§3.6 del plan):
  - QR del badge (F5.6): HTTPS://BUGCON.MX/A/<dorsal>/<bitmap>/<tag>. El
    hosting sirve esta página en /A/* (en file://, index.html#/A/...). El
    bitmap dice qué dorsales tiene (vista rápida); los detalles los pide a
    GET /api/album/<dorsal>/<bitmap>/<tag>, que verifica el tag (solo quien
    tiene el QR ve nicknames y handles).
  - El .json de la sincronización (F6.2, "bb26-album" v1) o el .bin de ALBM.
  Respuesta del backend (F6.4): 200 con el último .json sincronizado de ese
  badge y, opcional, "avatars": {"<dorsal>": "<base64 de 1152 B>"} (96x96,
  1 bpp, formato de AVTR); 403 = tag inválido; 404 = nunca sincronizó.
  Nada aquí verifica firmas ni tokens (necesitan K_master): eso es del
  backend, y el ranking solo cuenta lo que él verificó.
  Los textos de las estampas vienen de otros badges: siempre como texto.
-->
<style>
:root {
  --bg: #14161a;
  --card: #1e2128;
  --card2: #262a33;
  --text: #e8eaf0;
  --muted: #9aa1ae;
  --accent: #4da3ff;
  --ok: #4ec97a;
  --err: #ff6b6b;
  --border: #333845;
  --silver: #c3cad6;
  --gold: #e8b53a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 system-ui, sans-serif;
  padding: 16px;
  max-width: 1100px;
  margin: 0 auto;
}
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
h1 { font-size: 18px; font-weight: 600; flex: 1; }
h2 { font-size: 16px; font-weight: 600; }
button {
  background: var(--card2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  font: inherit;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #10131a; font-weight: 600; }
.hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
#status { padding: 8px 10px; background: var(--card2); border-radius: 6px; color: var(--muted); margin-bottom: 12px; }
#status.ok { color: var(--ok); }
#status.err { color: var(--err); }
body.over { outline: 2px dashed var(--accent); outline-offset: -6px; }
#summary {
  display: flex; gap: 14px; align-items: center;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; margin-bottom: 12px;
}
#summary > div:last-child { flex: 1; min-width: 0; }
#summary .st { width: 96px; }
#countBar { width: 100%; accent-color: var(--accent); margin-top: 6px; }
#tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
#tabs button { white-space: nowrap; flex: none; }
#tabs button[aria-selected=true] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; margin-bottom: 14px; }
#grid > p { grid-column: 1 / -1; color: var(--muted); }
.st {
  position: relative; display: flex; flex-direction: column; align-items: center;
  background: var(--card); border: 2px solid var(--border); border-radius: 8px;
  padding: 4px; min-width: 0; text-align: center; color: var(--text); font-size: 12px;
}
button.st:hover { border-color: var(--accent); }
.st.r1 { border-color: var(--silver); }
.st.r2 { border-color: var(--gold); }
.st.mine { box-shadow: 0 0 0 2px var(--accent); }
.st.empty { border-style: dashed; background: none; color: var(--muted); justify-content: center; aspect-ratio: 3 / 4; }
.st.got { justify-content: center; aspect-ratio: 3 / 4; color: var(--ok); }
.st .no { font-variant-numeric: tabular-nums; font-weight: 600; }
.st .face { width: 100%; aspect-ratio: 1; border-radius: 4px; margin-bottom: 3px; }
.st canvas.face { image-rendering: pixelated; background: #fff; }
.st div.face { display: flex; align-items: center; justify-content: center; background: var(--card2); font-size: 28px; font-weight: 700; color: var(--muted); }
.st .nick { width: 100%; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st .sub { width: 100%; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st .no.tag { position: absolute; top: 6px; left: 6px; background: #000a; color: #fff; border-radius: 4px; padding: 0 4px; font-size: 11px; }
dialog {
  margin: auto; background: var(--card); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px; padding: 16px;
  width: min(360px, calc(100vw - 32px));
}
dialog::backdrop { background: #000a; }
#dFace { width: 192px; height: 192px; display: block; margin: 0 auto 10px; image-rendering: pixelated; background: #fff; border-radius: 6px; }
#dNoFace { width: 192px; height: 192px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; background: var(--card2); border-radius: 6px; font-size: 72px; font-weight: 700; color: var(--muted); }
#dMeta { color: var(--muted); margin: 2px 0 10px; }
.stat { display: grid; grid-template-columns: 36px 26px 1fr; gap: 6px; align-items: center; font-size: 12px; margin-bottom: 4px; }
.stat i { display: block; height: 8px; background: var(--accent); border-radius: 4px; }
.stat span:nth-child(2) { text-align: right; font-variant-numeric: tabular-nums; }
#dHandle { margin-top: 10px; word-break: break-all; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
</style>
</head>
<body>

<header>
  <h1>Copa BugCon 2026 · Álbum</h1>
  <button id="openBtn">Abrir .json</button>
  <input type="file" id="file" accept=".json,.bin,application/json" hidden>
</header>
<div id="status" role="status">Escanea el código QR de tu badge (Álbum › Código QR) o abre
el .json que guarda el configurador al sincronizar.</div>

<section id="view" hidden>
  <div id="summary">
    <div id="mineSt"></div>
    <div>
      <h2 id="owner"></h2>
      <div id="countV"></div>
      <progress id="countBar" max="400" value="0"></progress>
      <p class="hint" id="source"></p>
    </div>
  </div>
  <nav id="tabs" role="tablist"></nav>
  <div id="grid"></div>
  <div class="row">
    <button id="vcfBtn" class="primary">Descargar contactos (.vcf)</button>
  </div>
  <p class="hint">Los contactos son las estampas cuyo dueño eligió compartir su handle.
  El handle lo escribe cada quien: revísalo antes de confiar en él.</p>
</section>

<dialog id="detail">
  <canvas id="dFace" width="96" height="96"></canvas>
  <div id="dNoFace"></div>
  <h2 id="dNick"></h2>
  <p id="dMeta"></p>
  <div id="dStats"></div>
  <p id="dHandle"></p>
  <div class="row">
    <button id="dVcf">Guardar contacto (.vcf)</button>
    <form method="dialog"><button>Cerrar</button></form>
  </div>
</dialog>

<script>
"use strict";

// Igual que el firmware: services/card.cpp (TEAMS, POSITIONS, RARITIES) y
// cfg::card de badge_config.h. tools/test_configurator.py revisa que
// coincidan (también los del configurador).
const TEAMS = ["Red Team", "Blue Team", "Purple Team", "Hardware",
               "AppSec", "OSINT", "Forense", "Cripto"];
const POSITIONS = ["Portero", "Defensa", "Medio", "Delantero", "Pentester"];
const RARITIES = ["Común", "Plata", "Oro"];
const STATS = ["ATK", "DEF", "HAX", "SUE"];
const STAT_MAX = 99;
const AVATAR_W = 96, AVATAR_H = 96;
const NICK_BYTES = 16, HANDLE_BYTES = 20;
const CARD_BYTES = 64, ALBUM_HEADER_BYTES = 80, ENTRY_BYTES = 80;
const ATTENDEE = 0, CHALLENGE = 1, FLAG_HANDLE = 0x02;
const ATTENDEES = 400;   // cfg::album::ATTENDEES
const SYNC_FORMAT = "bb26-album", SYNC_VERSION = 1;
const MAX_FILE_BYTES = 256 * 1024;   // el álbum lleno mide ≈ 52 KB en .json
const API_TIMEOUT_MS = 15000;
// Ruta del QR (album::qrText): bitmap de 50 B y tag de 8 B en base32.
const QR_RE = /\/A\/(\d{1,5})\/([A-Z2-7]{80})\/([A-Z2-7]{13})\/?$/i;
// El servidor que hospeda la página (F6.9); en file:// no hay.
// ?api= solo acepta localhost (pruebas).
const API = (() => {
  const api = new URLSearchParams(location.search).get("api");
  if (api && /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(api)) return api.replace(/\/?$/, "/");
  return location.protocol === "https:" ? new URL("/api/album/", location).href : null;
})();

const $ = id => document.getElementById(id);
const utf8 = new TextEncoder();
const inRange = n => n >= 1 && n <= ATTENDEES;

let album = null;   // { no, mine, entries, numbers, avatars, source }
let tab = 0;

function setStatus(msg, cls) {
  $("status").textContent = msg;
  $("status").className = cls || "";
}

/* ---------------- formato: ALBM y .json (como el configurador) ---------------- */

// 64 B de la estampa v1 (§3.2) -> objeto
function parseCard(b) {
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
  const text = (off, len) => {
    const s = b.subarray(off, off + len), end = s.indexOf(0);
    return new TextDecoder().decode(end < 0 ? s : s.subarray(0, end)).trim();
  };
  return {
    type: b[1], badgeNo: dv.getUint16(2, true),
    nickname: text(4, NICK_BYTES), team: b[20], position: b[21],
    stats: Array.from(b.subarray(22, 26)), rarity: b[26], flags: b[27],
    handle: text(28, HANDLE_BYTES),
  };
}

// Cabecera de 80 B (services/usb_protocol.h): "ALBM", formato 1,
// provisioned, MAC, count u16, reservado, mi estampa; luego count × 80 B
// (estampa 64, token 8, orden u16, nonce u32, reservado 2).
function validAlbm(data) {
  return data.length >= ALBUM_HEADER_BYTES &&
    String.fromCharCode(...data.subarray(0, 5)) === "ALBM\x01" &&
    data.length === ALBUM_HEADER_BYTES + ENTRY_BYTES * (data[12] | data[13] << 8);
}

function albumSummary(data) {
  return {
    badge_no: data[18] | data[19] << 8,
    mac: Array.from(data.subarray(6, 12), b => b.toString(16).padStart(2, "0").toUpperCase()).join(":"),
    provisioned: data[5] !== 0,
    count: data[12] | data[13] << 8,
  };
}

const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

// .json de la sync (o la respuesta del backend) -> exportación ALBM cruda,
// revisada como load_export() de tools/verify_album.py.
function exportFromJson(doc) {
  let data;
  try { data = fromB64(doc.albm); } catch (e) { /* base64 inválido */ }
  if (!doc || doc.format !== SYNC_FORMAT || doc.version !== SYNC_VERSION ||
      typeof doc.albm !== "string" || !data) {
    throw new Error("no es un álbum de la Copa BugCon 2026");
  }
  if (!validAlbm(data)) throw new Error("la exportación está incompleta o dañada");
  const s = albumSummary(data);
  for (const k in s) {
    if (doc[k] !== s[k]) throw new Error("el resumen no coincide con la exportación (¿se editó?)");
  }
  return data;
}

// Avatares opcionales del backend: {"<dorsal>": base64 de 1152 B}
function parseAvatars(obj) {
  const out = new Map();
  for (const [no, b64] of Object.entries(obj && typeof obj === "object" ? obj : {})) {
    try {
      const bytes = fromB64(b64);
      if (bytes.length === AVATAR_W * AVATAR_H / 8) out.set(+no, bytes);
    } catch (e) { /* se ignora el que no sirve */ }
  }
  return out;
}

function albumFromExport(data, avatars, source) {
  const mine = parseCard(data.subarray(16, 16 + CARD_BYTES));
  const seen = new Set(), entries = [];
  const count = data[12] | data[13] << 8;
  for (let i = 0; i < count; i++) {
    const off = ALBUM_HEADER_BYTES + i * ENTRY_BYTES;
    const card = parseCard(data.subarray(off, off + CARD_BYTES));
    const key = card.type + ":" + card.badgeNo;
    // El badge deduplica y no pega la suya: una repetida no cuenta.
    if (seen.has(key) || (card.type === ATTENDEE && card.badgeNo === mine.badgeNo)) continue;
    seen.add(key);
    entries.push({ card, order: data[off + 72] | data[off + 73] << 8 });
  }
  // Dorsales 1..400 que tengo, con el mío (album::collected)
  const numbers = new Set([mine.badgeNo, ...entries.filter(e => e.card.type === ATTENDEE)
    .map(e => e.card.badgeNo)].filter(inRange));
  return { no: mine.badgeNo, mine, entries, numbers, avatars: avatars || new Map(), source };
}

// Base32 de RFC 4648 sin relleno -> bytes
function base32(s) {
  const out = [];
  let buf = 0, bits = 0;
  for (const ch of s.toUpperCase()) {
    buf = (buf << 5 | "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567".indexOf(ch)) & 0xfff;
    bits += 5;
    if (bits >= 8) { bits -= 8; out.push(buf >> bits & 0xff); }
  }
  return Uint8Array.from(out);
}

// Dorsal n en el bit n - 1, MSB primero (album::bitmap)
function bitmapNumbers(bitmap) {
  const out = new Set();
  for (let n = 1; n <= ATTENDEES; n++) {
    if (bitmap[(n - 1) >> 3] & (0x80 >> ((n - 1) & 7))) out.add(n);
  }
  return out;
}

/* ---------------- vCard ---------------- */

// vCard 3.0 (RFC 2426): texto escapado, CRLF y renglones de ≤ 75 octetos.
const vEsc = s => s.replace(/[\x00-\x1f\x7f-\x9f]/g, "").replace(/[\\,;]/g, "\\$&");
function vFold(line) {
  let out = "", n = 0;
  for (const ch of line) {
    const b = utf8.encode(ch).length;
    if (n + b > 75) { out += "\r\n "; n = 1; }
    out += ch;
    n += b;
  }
  return out;
}

function vcard(cards) {
  return cards.map(c => [
    "BEGIN:VCARD", "VERSION:3.0",
    "FN:" + vEsc(c.nickname || "BugCon #" + c.badgeNo),
    "NICKNAME:" + vEsc(c.handle),
    "NOTE:" + vEsc(["Copa BugCon 2026", "#" + c.badgeNo, TEAMS[c.team], POSITIONS[c.position],
                    c.handle].filter(Boolean).join(" · ")),
    "CATEGORIES:BugCon 2026",
    "END:VCARD"].map(vFold).join("\r\n") + "\r\n").join("");
}

// Contactos: asistentes que compartieron su handle (opt-in, FLAG_HANDLE)
const hasHandle = c => c.type === ATTENDEE && (c.flags & FLAG_HANDLE) && c.handle !== "";
const contacts = () => album.entries.map(e => e.card).filter(hasHandle);

function download(text, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/vcard;charset=utf-8" }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------------- vista ---------------- */

// Secciones como la app del badge (apps/album): Todas (un hueco por
// dorsal), cada selección, "Sin selección" (solo si hay) y Especiales.
function sections() {
  const att = album.entries.filter(e => e.card.type === ATTENDEE)
    .sort((a, b) => a.card.badgeNo - b.card.badgeNo);
  const byNo = new Map(att.map(e => [e.card.badgeNo, e]));
  const all = [];
  for (let n = 1; n <= ATTENDEES; n++) {
    const mine = n === album.no, e = byNo.get(n);
    all.push({ no: n, card: mine ? album.mine : e && e.card, order: e && !mine ? e.order : undefined,
               got: album.numbers.has(n), mine });
  }
  const item = e => ({ no: e.card.badgeNo, card: e.card, got: true, order: e.order });
  const list = [{ name: "Todas", items: all }];
  TEAMS.forEach((name, i) => list.push({ name, items: att.filter(e => e.card.team === i).map(item) }));
  const none = att.filter(e => !(e.card.team < TEAMS.length));
  if (none.length) list.push({ name: "Sin selección", items: none.map(item) });
  list.push({ name: "Especiales", items: album.entries.filter(e => e.card.type !== ATTENDEE)
    .sort((a, b) => a.card.type - b.card.type || a.card.badgeNo - b.card.badgeNo).map(item) });
  return list;
}

// 1 bpp, filas completas, MSB primero, 1 = blanco (formato de AVTR)
function drawAvatar(canvas, packed) {
  const ctx = canvas.getContext("2d"), img = ctx.createImageData(AVATAR_W, AVATAR_H);
  for (let i = 0; i < AVATAR_W * AVATAR_H; i++) {
    const v = packed[i >> 3] & (0x80 >> (i & 7)) ? 255 : 0;
    img.data.set([v, v, v, 255], i * 4);
  }
  ctx.putImageData(img, 0, 0);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const pad = n => "#" + String(n).padStart(3, "0");
const kindName = c => c.type === ATTENDEE ? pad(c.badgeNo) :
  (c.type === CHALLENGE ? "Reto " : "Especial ") + c.badgeNo;

function face(c) {
  const avatar = c.type === ATTENDEE && album.avatars.get(c.badgeNo);
  if (avatar) {
    const cnv = el("canvas", "face");
    cnv.width = AVATAR_W;
    cnv.height = AVATAR_H;
    drawAvatar(cnv, avatar);
    return cnv;
  }
  return el("div", "face", ([...c.nickname][0] || "?").toUpperCase());
}

function sticker(it) {
  const c = it.card;
  if (!c) {
    const e = el("div", "st " + (it.got ? "got" : "empty"));
    e.append(el("span", "no", pad(it.no)));
    if (it.got) e.append(el("span", "sub", "sin datos"));
    e.title = it.got ? "La tienes; sincroniza el badge para ver sus datos." : "Hueco vacío";
    return e;
  }
  const e = el("button", "st r" + (c.rarity < RARITIES.length ? c.rarity : 0) + (it.mine ? " mine" : ""));
  e.append(face(c), el("span", "no tag", kindName(c)), el("span", "nick", c.nickname || "—"),
           el("span", "sub", it.mine ? "Mi estampa" : TEAMS[c.team] || "Sin selección"));
  e.addEventListener("click", () => showDetail(c, it.order));
  return e;
}

function render() {
  const secs = sections();
  tab = Math.min(tab, secs.length - 1);
  $("tabs").replaceChildren(...secs.map((s, i) => {
    const b = el("button", "", s.name + " " + (i ? s.items.length : album.numbers.size));
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", i === tab);
    b.addEventListener("click", () => { tab = i; render(); });
    return b;
  }));
  const items = secs[tab].items;
  $("grid").replaceChildren(...(items.length ? items.map(sticker) : [el("p", "", "Sin estampas")]));
  const n = contacts().length;
  $("vcfBtn").disabled = !n;
  $("vcfBtn").textContent = "Descargar contactos (.vcf)" + (n ? " · " + n : "");
}

function show(a) {
  album = a;
  tab = 0;
  $("owner").textContent = a.mine ? "Álbum de " + (a.mine.nickname || pad(a.no)) + " · " + pad(a.no)
                                  : "Álbum del " + pad(a.no);
  $("countV").textContent = a.numbers.size + "/" + ATTENDEES + " estampas" +
    (a.entries.length ? " · " + a.entries.length + " recibidas" : "");
  $("countBar").value = a.numbers.size;
  $("source").textContent = a.source;
  $("mineSt").replaceChildren(a.mine ? sticker({ no: a.no, card: a.mine, got: true, mine: true })
                                     : el("div", "st got", pad(a.no)));
  $("view").hidden = false;
  render();
}

function showDetail(c, order) {
  const avatar = c.type === ATTENDEE && album.avatars.get(c.badgeNo);
  $("dFace").hidden = !avatar;
  $("dNoFace").hidden = !!avatar;
  if (avatar) drawAvatar($("dFace"), avatar);
  else $("dNoFace").textContent = ([...c.nickname][0] || "?").toUpperCase();
  $("dNick").textContent = c.nickname || "—";
  $("dMeta").textContent = [kindName(c), TEAMS[c.team] || "Sin selección", POSITIONS[c.position],
    RARITIES[c.rarity], order !== undefined ? "recibida " + (order + 1) + "ª" : ""]
    .filter(Boolean).join(" · ");
  $("dStats").replaceChildren(...STATS.map((name, i) => {
    const row = el("div", "stat"), bar = el("i");
    bar.style.width = Math.min(100, c.stats[i] * 100 / STAT_MAX) + "%";
    row.append(el("span", "", name), el("span", "", String(c.stats[i])), el("span"));
    row.lastChild.append(bar);
    return row;
  }));
  const shared = hasHandle(c);
  $("dHandle").textContent = shared ? "Contacto: " + c.handle : "";
  $("dVcf").hidden = !shared || c.badgeNo === album.no;
  $("dVcf").onclick = () => download(vcard([c]), "bugcon_" + c.badgeNo + ".vcf");
  $("detail").showModal();
}

$("vcfBtn").addEventListener("click", () => {
  const list = contacts();
  download(vcard(list), "contactos_bugcon_" + album.no + ".vcf");
  setStatus("Se guardaron " + list.length + " contactos en contactos_bugcon_" + album.no + ".vcf.", "ok");
});

/* ---------------- fuentes: archivo y QR ---------------- */

async function openFile(f) {
  try {
    if (f.size > MAX_FILE_BYTES) throw new Error("es demasiado grande");
    const bytes = new Uint8Array(await f.arrayBuffer());
    let data = bytes, avatars, when = "";
    if (!validAlbm(bytes)) {   // no es un .bin de ALBM: el .json
      let doc;
      try { doc = JSON.parse(new TextDecoder().decode(bytes)); } catch (e) { /* abajo */ }
      data = exportFromJson(doc);
      avatars = parseAvatars(doc.avatars);
      if (typeof doc.exported_at === "string") when = ", exportado " + doc.exported_at;
    }
    show(albumFromExport(data, avatars, "Archivo " + f.name + when + "."));
    setStatus("Álbum abierto.", "ok");
  } catch (err) {
    setStatus(f.name + " no se puede abrir: " + err.message + ".", "err");
  }
}

$("openBtn").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", e => {
  const f = e.target.files[0];
  e.target.value = "";   // elegir el mismo archivo otra vez también dispara change
  if (f) openFile(f);
});
document.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("over"); });
document.addEventListener("dragleave", () => document.body.classList.remove("over"));
document.addEventListener("drop", e => {
  e.preventDefault();
  document.body.classList.remove("over");
  if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]);
});

// Vista rápida del QR y, si hay servidor, los detalles del último sync.
async function openQr(m) {
  const no = +m[1], bits = m[2].toUpperCase(), tag = m[3].toUpperCase();
  const numbers = bitmapNumbers(base32(bits));
  if (inRange(no)) numbers.add(no);
  const quick = { no, mine: null, entries: [], numbers, avatars: new Map(),
                  source: "Vista rápida del código QR: solo los dorsales." };
  show(quick);
  if (!API) { setStatus("Vista rápida del código QR.", "ok"); return; }
  setStatus("Buscando el álbum sincronizado…", "");
  let res;
  try {
    res = await fetch(API + no + "/" + bits + "/" + tag, { signal: AbortSignal.timeout(API_TIMEOUT_MS) });
  } catch (e) {
    setStatus("Sin conexión con el servidor: vista rápida del código QR.", "err");
    return;
  }
  if (res.status === 404) {
    setStatus("Este badge aún no sincroniza su álbum: se ven solo los dorsales del QR.", "ok");
    return;
  }
  try {
    const doc = await res.json().catch(() => ({}));
    if (res.status === 403) throw new Error("el código QR no es válido (¿alterado?)");
    if (!res.ok) throw new Error(doc.error || "el servidor respondió " + res.status);
    const data = exportFromJson(doc);
    if (albumSummary(data).badge_no !== no) throw new Error("el servidor mandó el álbum de otro badge");
    const a = albumFromExport(data, parseAvatars(doc.avatars),
      "Sincronizado" + (typeof doc.exported_at === "string" ? " el " + doc.exported_at : "") +
      " + código QR.");
    // El QR puede ser más nuevo que la sync: sus dorsales también cuentan.
    for (const n of numbers) a.numbers.add(n);
    show(a);
    setStatus("Álbum sincronizado.", "ok");
  } catch (err) {
    setStatus("No se pudo leer el álbum sincronizado: " + err.message + ". Vista rápida del QR.", "err");
  }
}

const qr = decodeURIComponent(location.pathname + location.hash.replace(/^#/, "")).match(QR_RE);
if (qr) openQr(qr);
</script>
